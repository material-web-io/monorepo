name: Publish

# Publishes both libraries to npm when a v<version> tag is pushed, as `npm run release` makes,
# then creates the tag's GitHub release. npm trusts this workflow by its filename (trusted
# publishing), so it needs no token, and each package's prepublishOnly runs the checks and its
# build first.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write # Lets npm verify that this workflow is the one publishing.

concurrency: publish

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      dist-tag: ${{ steps.version.outputs.dist-tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      # The checks in prepublishOnly include the browser tests.
      - run: npx playwright install --with-deps chromium
      - name: Check the tag against the package versions
        id: version
        run: |
          version="${GITHUB_REF_NAME#v}"
          for p in tailwind react; do
            actual="$(node -p "require('./packages/$p/package.json').version")"
            if [ "$actual" != "$version" ]; then
              echo "::error::packages/$p is at $actual, but the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done
          # A prerelease, such as 0.2.0-beta.1, is published under next, not latest.
          case "$version" in
            *-*) echo "dist-tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "dist-tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac
      # The theme first: the components depend on it at exactly this version.
      - run: npm publish --workspace @material-web/tailwind --tag ${{ steps.version.outputs.dist-tag }}
      - run: npm publish --workspace @material-web/react --tag ${{ steps.version.outputs.dist-tag }}

  release:
    # A job of its own, so that the token that can write to the repository never runs the
    # install, the tests or the build. It runs only once both packages are published.
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ needs.publish.outputs.dist-tag }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Links to the packages on npm, above the notes GitHub writes from the commits and
          # pull requests since the last release.
          notes="Published to npm under \`$DIST_TAG\`:

          - [@material-web/tailwind@$version](https://www.npmjs.com/package/@material-web/tailwind/v/$version)
          - [@material-web/react@$version](https://www.npmjs.com/package/@material-web/react/v/$version)"
          prerelease=()
          if [ "$DIST_TAG" = next ]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --generate-notes --notes "$notes" "${prerelease[@]}"
